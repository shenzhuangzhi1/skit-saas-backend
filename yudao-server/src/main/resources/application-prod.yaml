# Production is loaded after the secret-free application-runtime.yaml connectivity baseline.
spring:
  datasource:
    druid:
      web-stat-filter:
        enabled: false
      stat-view-servlet:
        enabled: false
  boot:
    admin:
      client:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  # Keep Tomcat's request-target/header ceiling aligned with the public Nginx edge.
  max-http-header-size: 64KB

knife4j:
  enable: false

yudao:
  captcha:
    enable: true
  security:
    mock-enable: false
    # New or changed passwords use BCrypt cost 10; existing hashes remain verifiable.
    password-encoder-length: 10
  demo: false
  # Callback URLs and query strings are sanitized before the API access log is recorded.
  access-log:
    enable: true
  sms-code:
    begin-code: 100000
    end-code: 999999
  wxa-code:
    env-version: release
  wxa-subscribe-message:
    miniprogram-state: formal

# Missing advertising key material must abort a production startup even outside Docker Compose.
mybatis-plus:
  encryptor:
    password: ${SKIT_AD_ENCRYPTION_KEY}

skit:
  security:
    client-ip:
      trusted-proxy-cidrs: ${SKIT_TRUSTED_PROXY_CIDRS}
  ad:
    callback:
      public-base-url: ${SKIT_AD_CALLBACK_PUBLIC_BASE_URL}
      legacy-impression-alias: ${SKIT_AD_CALLBACK_LEGACY_IMPRESSION_ALIAS:7f57b32820acbc0e34f067c1aff0a05d98197683678cc3af60d0027935bce6d4=1a0041c9f0864fa47222cacd113032ed2658cbb83f66c79ed325278ee0e7ac71}
    credential-encryption:
      current-key-id: ${SKIT_AD_CREDENTIAL_KEY_ID:primary}
      current-key: ${SKIT_AD_CREDENTIAL_KEY}
    session-token:
      current-key-version: ${SKIT_AD_SESSION_TOKEN_KEY_VERSION:1}
      current-key: ${SKIT_AD_SESSION_TOKEN_KEY}
    provider-callback-payload-encryption:
      current-key-id: ${SKIT_PROVIDER_CALLBACK_PAYLOAD_KEY_ID:primary}
      current-key: ${SKIT_PROVIDER_CALLBACK_PAYLOAD_KEY}
    provider-callback-audit:
      hmac-key: ${SKIT_PROVIDER_CALLBACK_AUDIT_HMAC_KEY}
    # Missing signed operations evidence must not block capture startup; issue/submit remains denied.
    provider-impression-production-gate:
      environment-fingerprint: ${SKIT_PROVIDER_IMPRESSION_GATE_ENVIRONMENT_FINGERPRINT:}
      operations-public-key: ${SKIT_PROVIDER_IMPRESSION_GATE_OPERATIONS_PUBLIC_KEY:}
      manifest-base64: ${SKIT_PROVIDER_IMPRESSION_GATE_MANIFEST_BASE64:}
      signature: ${SKIT_PROVIDER_IMPRESSION_GATE_SIGNATURE:}
